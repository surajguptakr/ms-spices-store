<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">Jeera powder illustrative spice artwork</title>
  <desc id="desc">A handmade ceramic bowl of cumin powder with scattered cumin seeds on a warm stone surface.</desc>
  <defs>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#f1e7d3"/><stop offset="1" stop-color="#d9c4a0"/></linearGradient>
    <radialGradient id="powder"><stop stop-color="#a36d31"/><stop offset=".72" stop-color="#805020"/><stop offset="1" stop-color="#674019"/></radialGradient>
    <linearGradient id="bowl" x2="0" y2="1"><stop stop-color="#8d5c36"/><stop offset="1" stop-color="#4a3024"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.8"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="seeds" width="44" height="38" patternUnits="userSpaceOnUse"><ellipse cx="10" cy="12" rx="8" ry="3.2" transform="rotate(-25 10 12)" fill="#b18446"/><path d="m4 12 12-1" stroke="#e0bb77" stroke-width="1"/><ellipse cx="32" cy="30" rx="7" ry="3" transform="rotate(24 32 30)" fill="#78502d"/></pattern>
  </defs>
